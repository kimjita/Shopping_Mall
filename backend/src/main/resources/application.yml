spring:
  application:
    name: shopping-mall
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

app:
  scheduling:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 30m
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  grade:
    # 기준 금액은 최근 3개월 구매확정 금액(원), 적립률은 basis point(50 = 0.5%)다.
    rules:
      BABY: { threshold: 0, earn-rate-bp: 50 }
      PINK: { threshold: 100000, earn-rate-bp: 100 }
      GREEN: { threshold: 200000, earn-rate-bp: 150 }
      BLACK: { threshold: 400000, earn-rate-bp: 200 }
      GOLD: { threshold: 800000, earn-rate-bp: 300 }
  cors:
    allowed-origins: http://localhost:5173
  auth:
    refresh:
      ttl: 14d
      cookie-name: refresh_token
      cookie-secure: true
      cookie-same-site: Lax
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: https://api.tosspayments.com
    connect-timeout: 3s
    read-timeout: 10s
  storage:
    # 로컬 기본값은 LocalStack(compose.yaml)이다. 운영은 환경변수로 덮는다. endpoint·access-key를 비우면 AWS 기본값을 쓴다.
    bucket: dewy-images
    region: ap-northeast-2
    endpoint: http://localhost:4566
    public-base-url: http://localhost:4566/dewy-images
    path-style: true
    access-key: test
    secret-key: test
