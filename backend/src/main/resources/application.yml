spring:
  application:
    name: shopping-mall
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 30m
  cors:
    allowed-origins: http://localhost:5173
