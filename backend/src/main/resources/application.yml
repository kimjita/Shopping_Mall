spring:
  application:
    name: shopping-mall
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 30m
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: http://localhost:5173
  auth:
    refresh:
      ttl: 14d
      cookie-name: refresh_token
      cookie-secure: true
      cookie-same-site: Lax
