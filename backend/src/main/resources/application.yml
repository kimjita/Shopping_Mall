spring:
  application:
    name: shopping-mall
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 30m
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  grade:
    # 기준 금액은 최근 3개월 구매확정 금액(원), 적립률은 basis point(50 = 0.5%)다.
    rules:
      BABY: { threshold: 0, earn-rate-bp: 50 }
      PINK: { threshold: 100000, earn-rate-bp: 100 }
      GREEN: { threshold: 200000, earn-rate-bp: 150 }
      BLACK: { threshold: 400000, earn-rate-bp: 200 }
      GOLD: { threshold: 800000, earn-rate-bp: 300 }
  cors:
    allowed-origins: http://localhost:5173
  auth:
    refresh:
      ttl: 14d
      cookie-name: refresh_token
      cookie-secure: true
      cookie-same-site: Lax
