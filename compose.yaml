services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopping_mall
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 이미지 업로드용 S3. 인증 토큰 없이 S3가 동작하는 커뮤니티 태그로 고정한다(테스트와 같은 태그).
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      # 서명한 Content-Type·Content-Length를 운영 S3처럼 검사한다.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d

volumes:
  pgdata:
